name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allows re-running the deployment from the Actions tab without a new commit.
  workflow_dispatch:

# The deploy job needs to mint an OIDC token for the Pages deployment API.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at once; queue instead of cancelling, so the last
# push always ends up being the published one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # A failing test must block the deployment, not just colour the log red.
      - run: npm test

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
